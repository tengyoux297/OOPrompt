<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Modifier Panel</title>
    <style>
    body {
        font-family: sans-serif;
        padding: 1em;
        color: #222;
    }

    textarea::placeholder {
        font-style: italic;
        color: #666;
    }

    textarea,
    #response,
    #optimizedPrompt {
        background-color: #eee;
        color: #222;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: 400;
        border: none;
        border-radius: 6px;
        padding: 10px;
        margin-top: 0.5em;
        white-space: pre-wrap;
        width: 100%;
        box-sizing: border-box;
    }

    #response em,
    #optimizedPrompt em {
        color: #666;
        font-style: italic;
    }

    button {
        background-color: #444;
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: 500;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        margin-top: 10px;
        margin-right: 6px;
        cursor: pointer;
    }

    button:hover {
        background-color: #555;
    }

    .field {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        align-items: baseline;
    }

    .field strong {
        min-width: 100px;
        color: #aaa;
    }

    .field span {
        color: #666;
    }

    .nested {
        margin-left: 1em;
    }
    
    h2{
        color: #fff;
    }
    h3 {
        color: #888;
        margin-top: 1em;
    }
    .feature-block {
        background-color: #eee;
        padding: 10px;
        border-radius: 6px;
        margin-top: 0.5em;
        font-family: sans-serif;
        font-size: 14px;
        color: #222;
    }
    </style>
</head>
<body>
    <h2>Prompt Modifier</h2>

    <h3>Initial Prompt:</h3>
    <textarea id="query" placeholder="Enter your prompt..."></textarea><br>

    <div style="margin-top: 10px;">
    <button onclick="sendQuery()">Generate Features</button>
    </div>

    <h3>Generated Features:</h3>
    <div id="response"><em>Waiting for response...</em></div>
    <button id="candidatesBtn" style="display: none;" onclick="sendCandidates()">Generate Candidates</button>

    <h3>Candidate Features:</h3>
    <div id="candidateResponse" class="feature-block">
    <em>Waiting for features...</em>
    </div>

    <div style="margin-top: 10px;">
    <button id="regenerateBtn" style="display: none;" onclick="sendOptimizedPrompt()">Regenerate Prompt</button>
    </div>

    <h3>Optimized Prompt:</h3>
    <div id="optimizedPrompt"><em>Regenerated prompt will appear here.</em></div>
    
    <script>
    function stripCodeBlock(text) {
            return text.trim().replace(/^```(?:json)?\s*([\s\S]*?)\s*```$/, '$1');
          }    const vscode = acquireVsCodeApi();
    let lastParsedFeatures = null;
    let candidateFeatures = null;

    function sendQuery() {
        const query = document.getElementById('query').value.trim();
        if (!query) {
        document.getElementById('response').innerHTML = '<em>Please enter a prompt.</em>';
        return;
        }

        document.getElementById('response').innerHTML = '<em>Loading...</em>';
        document.getElementById('optimizedPrompt').innerHTML = '<em>Regenerated prompt will appear here.</em>';
        document.getElementById('regenerateBtn').style.display = 'none';
        lastParsedFeatures = null;

        vscode.postMessage({ type: 'query', prompt: query });
    }    function sendOptimizedPrompt() {
        // Use candidateFeatures for regenerating prompt, not lastParsedFeatures
        if (!candidateFeatures) {
            console.log('No candidate features available. Please generate candidates first.');
            return;
        }
        document.getElementById('optimizedPrompt').innerHTML = '<em>Optimizing...</em>';
        vscode.postMessage({ type: 'regenerate', features: candidateFeatures });
    }function renderValue(value, parentKey = '', isTopLevel = false, context = '') {
        if (typeof value === 'object' && value !== null) {
        const container = document.createElement('div');

        if (Array.isArray(value)) {
            const ul = document.createElement('ul');
            ul.style.margin = '0';
            ul.style.paddingLeft = '20px';

            value.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            ul.appendChild(li);
            });

            container.appendChild(ul);
        } else {
            for (const [key, val] of Object.entries(value)) {
            const row = document.createElement('div');
            row.className = 'field';
            row.style.position = 'relative';            const label = document.createElement('strong');
            
            // Make feature names editable for top-level features
            if (isTopLevel && context === 'features') {
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = key;
                nameInput.style.backgroundColor = '#f9f9f9';
                nameInput.style.border = '1px solid #ddd';
                nameInput.style.borderRadius = '4px';
                nameInput.style.padding = '4px 8px';
                nameInput.style.fontSize = '14px';
                nameInput.style.fontWeight = 'bold';
                nameInput.style.color = '#aaa';
                nameInput.style.minWidth = '100px';
                nameInput.style.marginRight = '5px';
                
                nameInput.addEventListener('input', () => {
                    const newKey = nameInput.value.trim();
                    if (newKey && newKey !== key && lastParsedFeatures) {
                        // Store the old value
                        const oldValue = lastParsedFeatures[key];
                        
                        // Delete old key and add new key
                        delete lastParsedFeatures[key];
                        lastParsedFeatures[newKey] = oldValue;
                        
                        console.log('Updated feature name from:', key, 'to:', newKey);
                        console.log('Current features:', lastParsedFeatures);
                        
                        // Re-render to reflect the change
                        setTimeout(() => {
                            const responseEl = document.getElementById('response');
                            responseEl.innerHTML = '';
                            responseEl.appendChild(renderValue(lastParsedFeatures, '', true, 'features'));
                            
                            const formContainer = createAddFeatureForm();
                            responseEl.appendChild(formContainer);
                        }, 100);
                    }
                });
                
                row.appendChild(nameInput);
                
                // Add colon after the input
                const colon = document.createElement('span');
                colon.textContent = ':';
                colon.style.marginRight = '8px';
                row.appendChild(colon);
            } else {
                label.textContent = key.charAt(0).toUpperCase() + key.slice(1) + ':';
                row.appendChild(label);
            }// Add delete button for top-level features (but not for nested properties like 'value' or 'fixed')
            if (isTopLevel && context === 'features') {
                console.log('Adding delete button for feature:', key); // Debug log
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '×';
                deleteBtn.style.position = 'absolute';
                deleteBtn.style.right = '0';
                deleteBtn.style.top = '0';                
                deleteBtn.style.backgroundColor = '#d32f2f';
                deleteBtn.style.color = 'white';
                deleteBtn.style.border = 'none';
                deleteBtn.style.borderRadius = '3px';
                deleteBtn.style.width = '20px';
                deleteBtn.style.height = '20px';
                deleteBtn.style.cursor = 'pointer';
                deleteBtn.style.fontSize = '12px';
                deleteBtn.style.display = 'flex';
                deleteBtn.style.alignItems = 'center';
                deleteBtn.style.justifyContent = 'center';
                deleteBtn.title = `Delete ${key}`;
                deleteBtn.style.zIndex = '1000';
                  deleteBtn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Delete button clicked for:', key); // Debug log
                    console.log('Current lastParsedFeatures:', lastParsedFeatures); // Debug log
                    
                    // Remove confirmation dialog since webview is sandboxed
                    if (lastParsedFeatures && lastParsedFeatures[key]) {
                        delete lastParsedFeatures[key];
                        console.log('Feature deleted. Updated features:', lastParsedFeatures); // Debug log
                        
                        // Re-render the features
                        const responseEl = document.getElementById('response');
                        responseEl.innerHTML = '';
                        responseEl.appendChild(renderValue(lastParsedFeatures, '', true, 'features'));
                        
                        // Re-add the form container
                        const formContainer = createAddFeatureForm();
                        responseEl.appendChild(formContainer);
                    } else {
                        console.error('Feature not found in lastParsedFeatures:', key);
                    }
                };
                
                row.appendChild(deleteBtn);
            }            if (key === 'fixed') {
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = Boolean(val);
                checkbox.dataset.feature = parentKey;

                checkbox.addEventListener('change', () => {
                scheduleFeatureUpdate();
                });

                if (!isTopLevel || context !== 'features') {
                    const fixedLabel = document.createElement('strong');
                    fixedLabel.textContent = 'Fixed:';
                    row.appendChild(fixedLabel);
                }
                row.appendChild(checkbox);
            } else if (typeof val === 'object') {
                if (!isTopLevel || context !== 'features') {
                    row.appendChild(label);
                }
                row.appendChild(renderValue(val, parentKey || key, false, context));
            } else if (key === 'value' && context === 'features') {
                // Make feature values editable
                const valueInput = document.createElement('input');
                valueInput.type = 'text';
                valueInput.value = String(val);
                valueInput.style.backgroundColor = '#f9f9f9';
                valueInput.style.border = '1px solid #ddd';
                valueInput.style.borderRadius = '4px';
                valueInput.style.padding = '4px 8px';
                valueInput.style.fontSize = '14px';
                valueInput.style.width = '120px';
                
                valueInput.addEventListener('input', () => {
                    if (lastParsedFeatures && lastParsedFeatures[parentKey]) {
                        lastParsedFeatures[parentKey].value = valueInput.value;
                        console.log('Updated feature value:', parentKey, '=', valueInput.value);
                        console.log('Current features:', lastParsedFeatures);
                    }
                });
                
                if (!isTopLevel || context !== 'features') {
                    row.appendChild(label);
                }
                row.appendChild(valueInput);
            } else {
                const valEl = document.createElement('span');
                valEl.textContent = String(val);
                if (!isTopLevel || context !== 'features') {
                    row.appendChild(label);
                }
                row.appendChild(valEl);
            }

            container.appendChild(row);
            }
        }

        return container;
        } else {
        const span = document.createElement('span');
        span.textContent = String(value);
        return span;
        }
    }



    function createAddFeatureForm() {
        const formContainer = document.createElement('div');
        formContainer.style.marginTop = '1em';
        formContainer.style.paddingTop = '1em';
        formContainer.style.borderTop = '1px solid #ccc';

        // Feature name input
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.placeholder = 'Feature name';
        nameInput.style.marginRight = '8px';

        // Value input
        const valueInput = document.createElement('input');
        valueInput.type = 'text';
        valueInput.placeholder = 'Value';
        valueInput.style.marginRight = '8px';

        // Fixed checkbox
        const fixedCheckbox = document.createElement('input');
        fixedCheckbox.type = 'checkbox';
        fixedCheckbox.id = 'fixedCheckbox';
        const fixedLabel = document.createElement('label');
        fixedLabel.textContent = 'Fixed';
        fixedLabel.htmlFor = 'fixedCheckbox';
        fixedLabel.style.marginRight = '8px';

        // Add button
        const addBtn = document.createElement('button');
        addBtn.textContent = '+ Add Feature';
        addBtn.onclick = () => {
            const key = nameInput.value.trim();
            const val = valueInput.value.trim();
            const isFixed = fixedCheckbox.checked;

            if (!key || !val) {
                alert('Please fill in both feature name and value.');
                return;
            }

            lastParsedFeatures[key] = {
                value: val,
                fixed: isFixed
            };

            // Re-render feature list
            const responseEl = document.getElementById('response');
            responseEl.innerHTML = '';
            responseEl.appendChild(renderValue(lastParsedFeatures, '', true, 'features'));
            responseEl.appendChild(createAddFeatureForm());

            // Clear inputs
            nameInput.value = '';
            valueInput.value = '';
            fixedCheckbox.checked = false;

            // Log updated features
            console.log('Updated JSON after add:', JSON.stringify(lastParsedFeatures, null, 2));
        };

        // Append inputs to form container
        formContainer.appendChild(nameInput);
        formContainer.appendChild(valueInput);
        formContainer.appendChild(fixedCheckbox);
        formContainer.appendChild(fixedLabel);
        formContainer.appendChild(addBtn);

        return formContainer;
    }

    window.addEventListener('message', event => {
        const message = event.data;
        const responseEl = document.getElementById('response');
        const optimizedEl = document.getElementById('optimizedPrompt');        if (message.type === 'response') {
            responseEl.innerHTML = '';
            try {
              const cleaned = stripCodeBlock(message.text);
              const parsed = JSON.parse(cleaned);
              lastParsedFeatures = parsed;
              console.log('Setting lastParsedFeatures:', lastParsedFeatures); // Debug log
              
              // Don't show regenerate button until candidates are generated
              // document.getElementById('regenerateBtn').style.display = 'inline-block';
              responseEl.appendChild(renderValue(parsed, '', true, 'features'));

              // Add feature form
              const formContainer = createAddFeatureForm();
              responseEl.appendChild(formContainer);
              
            } catch {
              lastParsedFeatures = null;
              responseEl.textContent = message.text;
            }} else if (message.type === 'candidates') {
            const candidateEl = document.getElementById('candidateResponse');
            candidateEl.innerHTML = '';
            try {
              let cleanedText = message.text.trim();

              const parsed = JSON.parse(cleanedText);
              
              // Store candidate features separately, don't overwrite lastParsedFeatures
              candidateFeatures = parsed;
              console.log('Setting candidateFeatures:', candidateFeatures);
              
              // Show regenerate button only when candidates are available
              document.getElementById('regenerateBtn').style.display = 'inline-block';
              
              // Render candidates as read-only (not editable)
              candidateEl.appendChild(renderValue(parsed, '', false, 'candidates'));
            } catch {
              candidateEl.textContent = message.text || 'Failed to parse candidate output.';
            }

        } else if (message.type === 'optimized') {
        try {
            const parsed = JSON.parse(message.text);
            const prompts = parsed.prompts || [];

            if (Array.isArray(prompts) && prompts.length > 0) {
                optimizedEl.innerHTML = '';
                // Create a form for radio buttons
                const form = document.createElement('form');
                form.id = 'promptRadioForm';
                let selectedPromptIndex = 0;
                prompts.forEach((prompt, i) => {
                    const div = document.createElement('div');
                    div.style.display = 'flex';
                    div.style.alignItems = 'center';
                    div.style.marginBottom = '4px';
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'optimizedPromptRadio';
                    radio.value = i;
                    radio.style.marginRight = '8px';
                    if (i === 0) {
                        radio.checked = true;
                    }
                    radio.addEventListener('change', () => {
                        selectedPromptIndex = i;
                    });
                    const label = document.createElement('label');
                    label.textContent = prompt;
                    label.style.flex = '1';
                    div.appendChild(radio);
                    div.appendChild(label);
                    form.appendChild(div);
                });
                optimizedEl.appendChild(form);
                // Add insert button after displaying the prompts
                let insertBtn = document.createElement('button');
                insertBtn.textContent = 'Insert Final Prompt';
                insertBtn.style.marginTop = '10px';
                insertBtn.onclick = function(e) {
                    e.preventDefault();
                    // Find selected radio
                    const radios = form.elements['optimizedPromptRadio'];
                    let idx = 0;
                    if (radios.length) {
                        for (let j = 0; j < radios.length; j++) {
                            if (radios[j].checked) {
                                idx = parseInt(radios[j].value);
                                break;
                            }
                        }
                    } else {
                        idx = radios.checked ? parseInt(radios.value) : 0;
                    }
                    vscode.postMessage({ type: 'insertFinalPrompt', prompt: prompts[idx] });
                };
                optimizedEl.appendChild(insertBtn);
            } else {
                optimizedEl.innerHTML = '<em>No prompts found in response.</em>';
            }
        } catch (err) {
            console.error('Failed to parse optimized prompt JSON:', err);
            optimizedEl.innerHTML = '<pre>' + message.text + '</pre>';
        }
        }else if (message.type === 'showCandidatesButton') {
        document.getElementById('candidatesBtn').style.display = 'inline-block';
        }


    });
    
    let updateTimeout = null;
    function scheduleFeatureUpdate() {
        if (updateTimeout) clearTimeout(updateTimeout);
        updateTimeout = setTimeout(updateFeatureStatesFromCheckboxes, 300);
    }

    function updateFeatureStatesFromCheckboxes() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"][data-feature]');
        if (!lastParsedFeatures) return;

        checkboxes.forEach(cb => {
        const feature = cb.dataset.feature;
        if (lastParsedFeatures[feature]) {
            lastParsedFeatures[feature].fixed = cb.checked;
        }
        });

        console.log('Updated features:', lastParsedFeatures);
    }    function sendCandidates() {
        // Use lastParsedFeatures (the original features) to generate candidates
        if (!lastParsedFeatures) {
            console.log('No features available. Please generate features first.');
            return;
        }
        document.getElementById('candidateResponse').innerHTML = '<em>Generating candidate features...</em>';
        vscode.postMessage({ type: 'candidates', features: lastParsedFeatures });
    }

    </script>
</body>
</html>
